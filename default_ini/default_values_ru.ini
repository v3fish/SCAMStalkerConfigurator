[VitalParams]
MaxHP = 100 ; Максимальные очки здоровья
MaxSP = 100 ; Максимальные очки выносливости
MaxBleeding = 100 ; Максимальное кровотечение
MaxRadiation = 100 ; Максимальная радиация
MaxSleepinessPoints = 100 ; Максимальные очки сонливости
MaxHungerPoints = 100 ; Максимальные очки голода
MaxThirstPoints = 100 ; Максимальные очки жажды
MaxSuppressionPoints = 100 ; Максимальные очки подавления
RegenHungerPoints = 0.015 ; Очки голода увеличиваются в секунду
RegenThirstPoints = 0.0 ; Очки жажды увеличиваются в секунду
DegenBleeding = 0.3 ; Скорость уменьшения кровотечения со временем
DegenRadiation = 0.05 ; Скорость уменьшения радиации со временем
DegenPsyPoints = 1.0 ; Скорость уменьшения пси-очков со временем
DegenSuppressionPoints = 33.0 ; Скорость уменьшения очков подавления со временем
DegenSuppressionDelayTimeSeconds = 2 ; Задержка в секундах перед началом спадания подавления
RegenSleepinessPoints = 0.01 ; Очки сонливости увеличиваются в секунду
RegenHP = 0.0 ; Скорость восстановления здоровья
RegenHPDelayTimeSeconds = 5 ; Задержка в секундах перед началом восстановления здоровья
RegenSP = 5.0 ; Скорость восстановления выносливости
RegenPoppyFieldSleepiness = 0 ; Восстановление очков сонливости в областях макового поля
StaminaDisableThreshold = 16.1 ; Очки выносливости, ниже которых спринт отключается

[VaultingParams]
MaxAngle=75|358 ; Максимальный угол, под которым можно подойти к препятствию
MaxTestDistance=15 ; Расстояние проверки препятствий для перепрыгивания
StartDistance=10 ; Расстояние впереди персонажа, с которого начинается поиск для перепрыгивания
HeightBetweenObjects=123 ; Необходимое свободное пространство над препятствием или в проёме
WidthBetweenObjects=60 ; Необходимая ширина проёма для перепрыгивания
VaultOverMaxDepth=50 ; Максимальная толщина объекта, через который можно перепрыгнуть
VaultOverLandOffset=20 ; Расстояние за объектом, на котором происходит приземление после перепрыгивания
MinObstacleHeight=70 ; Минимальная высота препятствия, через которое можно перепрыгнуть
MaxObstacleHeight=130 ; Максимальная высота препятствия, через которое можно перепрыгнуть
MinForwardAxisInputValue=0.1|1 ; Необходимый уровень нажатия кнопки вперёд для начала перепрыгивания
FrontSearchRadiusModifier=0.5 ; Ширина зоны поиска впереди
DepthTraceRadiusModifier=0.5 ; Ширина проверки при зондировании поверхности
WindowBackTraceRadiusModifier=0.5 ; Ширина проверки при поиске сквозь окно
WindowBackTraceHeightModifier=0.8 ; Высота проверки при поиске сквозь окно
LandingMinHeight=30 ; Минимальный просвет, необходимый для места приземления
MaxWindowDetectionIterations=10 ; Сколько раз игра проверяет наличие проёма в окне
MaxLandingDetectionIterations=5 ; Сколько раз игра ищет место для приземления
MaxLandingOffset=50 ; Насколько далеко может сдвинуться точка приземления от идеальной
LandingCorrectionAdditionalSize=2 ; Дополнительный просвет при корректировке точки приземления
LandingMaxSlope=45 ; Максимальный допустимый уклон поверхности для приземления
VaultOverStandingHeight=0 ; Смещение высоты при перепрыгивании через объект стоя
VaultOverCrouchingHeight=40 ; Смещение высоты при перепрыгивании через объект в приседе
AboveObstaclesCheckHeight=55 ; Дополнительная высота проверки над препятствием для зазора

